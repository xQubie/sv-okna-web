<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Склад">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12100E">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF6EE">
    <title>Склад</title>
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/app.css?v=6">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="bg" aria-hidden="true"><div class="bg-img" id="bgImg"></div></div>
    <div class="scrim" aria-hidden="true"></div>
    <div class="status-fade" aria-hidden="true"></div>

    <header class="top">
        <div class="top-text">
            <h1>СКЛАД</h1>
            <p id="syncLabel">ещё не синхронизировали</p>
        </div>
        <div class="chrome">
            <button class="chrome-btn" id="refreshBtn" type="button" aria-label="Обновить">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12a9 9 0 1 1-2.3-6"/>
                    <path d="M21 3v6h-6"/>
                </svg>
            </button>
            <a class="chrome-btn" id="webBtn" href="https://sv-okna.ru/derevyannyie-okna-dlya-bani.htm" target="_blank" rel="noopener" aria-label="Сайт">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M3 12h18"/>
                    <path d="M12 3a15 15 0 0 1 0 18"/>
                    <path d="M12 3a15 15 0 0 0 0 18"/>
                </svg>
            </a>
        </div>
    </header>

    <div id="errorBanner" class="error-banner hidden">
        <span id="errorText">Нет связи со складом</span>
        <button type="button" id="retryBtn">Повторить</button>
    </div>

    <div class="pages" id="pages"></div>

    <footer class="dock" id="dock">
        <div class="dock-handle" id="dockHandle" aria-label="Скрыть или показать разделы">
            <span class="dock-bar"></span>
        </div>
        <div class="plaques-track">
            <div class="plaques" id="plaques">
                <div class="plaques-strip" id="plaquesStrip"></div>
            </div>
        </div>
    </footer>

    <div id="toast" class="toast hidden">Информация обновлена</div>

    <script src="js/app.js?v=6"></script>
</body>
</html>
