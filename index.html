<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Склад">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#071018">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#8AA7BB">
    <title>Склад</title>
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/app.css?v=20">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="scene" aria-hidden="true">
        <div class="scene-photo"></div>
        <div class="scene-wash"></div>
    </div>

    <div class="chrome" id="chrome">
        <header class="appbar">
            <div class="brand">
                <p class="eyebrow">Склад</p>
                <p class="sync" id="syncLabel">ещё не синхронизировали</p>
            </div>
            <div class="actions">
                <button type="button" class="icon-btn" id="refreshBtn" aria-label="Обновить">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 1 1-2.3-6"/>
                        <path d="M21 3v6h-6"/>
                    </svg>
                </button>
                <button type="button" class="icon-btn" id="webBtn" aria-label="Сайт">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M3 12h18"/>
                        <path d="M12 3a15 15 0 0 1 0 18"/>
                        <path d="M12 3a15 15 0 0 0 0 18"/>
                    </svg>
                </button>
            </div>
        </header>
    </div>

    <div id="errorBanner" class="banner hidden">
        <span id="errorText">Нет связи со складом</span>
        <button type="button" id="retryBtn">Повторить</button>
    </div>

    <main class="stage" id="stage">
        <div class="stage-track" id="stageTrack"></div>
    </main>

    <nav class="dock" id="dock" aria-label="Разделы">
        <div class="sections" id="sections"></div>
    </nav>
    <div id="toast" class="toast hidden">Информация обновлена</div>
    <div id="infoDlg" class="dlg hidden" role="dialog" aria-modal="true" aria-labelledby="infoDlgTitle">
        <button type="button" class="dlg-scrim" id="infoDlgScrim" aria-label="Закрыть"></button>
        <div class="dlg-card">
            <h2 class="dlg-title" id="infoDlgTitle"></h2>
            <p class="dlg-text" id="infoDlgText"></p>
            <button type="button" class="dlg-ok" id="infoDlgOk">Закрыть</button>
        </div>
    </div>

    <script src="js/app.js?v=20"></script>
</body>
</html>
