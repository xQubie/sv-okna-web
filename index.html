<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-title" content="Склад">
    <title>Склад</title>
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/app.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="scrim"></div>
    <div class="status-fade"></div>
    <header class="top">
        <div class="top-text">
            <h1>Склад</h1>
            <p id="syncLabel">ещё не синхронизировали</p>
        </div>
        <button class="refresh-btn" id="refreshBtn" type="button" aria-label="Обновить">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12a9 9 0 1 1-2.3-6"/>
                <path d="M21 3v6h-6"/>
            </svg>
            <span>Обновить</span>
        </button>
    </header>

    <div id="errorBanner" class="error-banner hidden">
        <span id="errorText">Нет связи со складом</span>
        <button type="button" id="retryBtn">Повторить</button>
    </div>

    <div class="carousel-wrap">
        <div class="carousel" id="carousel"></div>
        <div class="rail"></div>
    </div>

    <section class="panel" id="panel">
        <div class="positions" id="positions"></div>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
