<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="color-scheme" content="light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#F3EDE2">
    <meta name="apple-mobile-web-app-title" content="Склад">
    <title>Склад</title>
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,650&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="page" id="catalog">
        <header class="mast">
            <p class="eyebrow">СВ-Окна</p>
            <div class="mast-row">
                <h1>Склад</h1>
                <button class="text-btn" id="refreshBtn" type="button">Обновить</button>
            </div>
            <p class="sync" id="syncLabel">ещё не синхронизировали</p>
        </header>

        <div id="errorBanner" class="error-banner hidden">
            <span id="errorText">Нет связи со складом</span>
            <button type="button" id="retryBtn">Повторить</button>
        </div>

        <section class="covers" id="covers"></section>
    </div>

    <div class="page sheet" id="sheet" hidden>
        <header class="sheet-top">
            <button class="text-btn" id="backBtn" type="button">← каталог</button>
            <button class="text-btn" id="sheetRefresh" type="button">Обновить</button>
        </header>
        <p class="sheet-no" id="sheetNo"></p>
        <h2 class="sheet-title" id="sheetTitle"></h2>
        <p class="sheet-info" id="sheetInfo" hidden></p>
        <div class="ledger" id="positions"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
