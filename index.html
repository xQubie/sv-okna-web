<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Склад">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101218">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F5F9">
    <title>СВ Окна · Склад</title>
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/app.css?v=40">
    <script src="js/theme.js?v=40"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="scene" aria-hidden="true"><div class="scene-photo"></div><div class="scene-tint"></div></div>
    <div class="chrome" id="chrome">
        <header class="appbar">
            <div class="brand">
                <p class="eyebrow">СКЛАД</p>
                <p class="sync" id="syncLabel">Загружаем склад…</p>
            </div>
            <div class="actions">
                <button type="button" class="icon-btn" id="refreshBtn" aria-label="Обновить">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 1 1-2.3-6"/>
                        <path d="M21 3v6h-6"/>
                    </svg>
                </button>
                <button type="button" class="icon-btn" id="webBtn" aria-label="Сайт">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M3 12h18"/>
                        <path d="M12 3a15 15 0 0 1 0 18"/>
                        <path d="M12 3a15 15 0 0 0 0 18"/>
                    </svg>
                </button>
                <button type="button" class="icon-btn" id="settingsBtn" aria-label="Настройки" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m9 3 .7-1h4.6l.7 3 2 .9 2.8-.8 2.2 3.8-2.1 2.2v2.3l2.1 2.2-2.2 3.8-2.8-.8-2 .9-.7 2.5H9.7L9 19.5l-2-.9-2.8.8L2 15.6l2.1-2.2v-2.3L2 8.9l2.2-3.8L7 5.9l2-.9Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
        </header>
    </div>

    <div id="errorBanner" class="banner hidden" role="alert">
        <span id="errorText">Нет связи со складом</span>
        <button type="button" id="retryBtn">Повторить</button>
    </div>

    <main class="stage" id="stage">
        <div class="stage-track" id="stageTrack"><div class="loading-state" role="status"><span class="loading-orbit"></span><h1>Ваш склад, под рукой</h1><p>Загружаем разделы и позиции</p><div class="skeleton"></div><div class="skeleton"></div></div></div>
    </main>

    <nav class="dock" id="dock" aria-label="Разделы склада">
        <div class="dock-handle" aria-hidden="true"></div>
        <div class="dock-header"><button id="catalogBtn" aria-haspopup="dialog" aria-expanded="false">Все разделы <span id="dockCounter"></span></button><span id="dockTitle" class="sr-only"></span><button class="icon-btn" id="nextBtn" aria-label="Следующий раздел"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m9 5 7 7-7 7"/></svg></button></div>
        <div class="section-cards" id="sectionCards"></div>
    </nav>
    <dialog id="settingsDlg" class="settings-dialog" aria-labelledby="settingsTitle">
        <div class="settings-handle-zone" id="settingsHandle" aria-hidden="true"><span class="sheet-handle"></span></div>
        <header class="sheet-header"><h2 id="settingsTitle">Настройки</h2><button id="settingsClose" class="icon-btn" aria-label="Закрыть настройки">×</button></header>
        <div class="settings-content">
            <fieldset><legend>Оформление</legend><div class="theme-options">
                <label class="theme-choice"><input type="radio" name="glassStyle" value="warm"><span class="theme-preview preview-warm"><i></i><i></i><i></i><b>✓</b></span><span>Тёплое</span></label>
                <label class="theme-choice"><input type="radio" name="glassStyle" value="blue"><span class="theme-preview preview-blue"><i></i><i></i><i></i><b>✓</b></span><span>Синее</span></label>
                <label class="theme-choice"><input type="radio" name="glassStyle" value="silver"><span class="theme-preview preview-silver"><i></i><i></i><i></i><b>✓</b></span><span>Серебристое</span></label>
            </div></fieldset>
            <fieldset class="scheme-field"><legend>Цветовая схема</legend><div class="scheme-options">
                <label><input type="radio" name="colorMode" value="light"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>Светлая</span></label>
                <label><input type="radio" name="colorMode" value="dark"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/></svg>Тёмная</span></label>
                <label><input type="radio" name="colorMode" value="system"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></svg>Системная</span></label>
            </div><p class="settings-hint">Системная — как на устройстве</p></fieldset>
            <div class="selection-summary"><span class="summary-swatch" aria-hidden="true"></span><span id="selectionLabel"></span></div>
            <p class="settings-hint" id="settingsHint">Изменения применяются сразу</p>
        </div>
    </dialog>
    <dialog id="categoryDlg" class="category-dialog" aria-labelledby="categoryTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <header class="sheet-header"><div><p class="overline">СВ ОКНА / КАТАЛОГ</p><h2 id="categoryTitle">Все разделы</h2></div><button id="categoryClose" class="icon-btn" aria-label="Закрыть разделы">×</button></header>
        <div class="sections" id="sections"></div>
    </dialog>
    <div id="toast" class="toast hidden" role="status" aria-live="polite">Информация обновлена</div>
    <div id="infoDlg" class="dlg hidden" role="dialog" aria-modal="true" aria-labelledby="infoDlgTitle">
        <button type="button" class="dlg-scrim" id="infoDlgScrim" aria-label="Закрыть"></button>
        <div class="dlg-card">
            <h2 class="dlg-title" id="infoDlgTitle"></h2>
            <p class="dlg-text" id="infoDlgText"></p>
            <button type="button" class="dlg-ok" id="infoDlgOk">Закрыть</button>
        </div>
    </div>

    <script src="js/app.js?v=40"></script>
</body>
</html>
